<h2 class="text-2xl font-bold mt-5">Buscar Gifs</h2>
<h3 class="text-2xl font-bold mt-5">Buscar por nombre, descripción o tags</h3>

<section class="flex flex-column gap-4">
  <input
    type="text"
    placeholder="Buscar Gifs"
    class="mt-3 border border-gray-300 rounded p-2"
    (keyup.enter)="onSearch(txtSearch.value)"
    #txtSearch
  />
</section>

<gifs-list [gifs]="gifs()" />
